<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1024">
<title>愤怒的小鸟 · 5 种小鸟</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 0%, #1b2a4a 0%, #0b1226 45%, #05070f 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #game {
    display: block;
    border-radius: 14px;
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(160, 190, 255, 0.12), 0 0 60px rgba(90, 130, 255, 0.12);
    cursor: crosshair;
    touch-action: none;
    background: #0a1024;
  }
  #hint {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.42); font-size: 12px; letter-spacing: 0.5px;
    pointer-events: none; white-space: nowrap;
  }
  @media (max-height: 520px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">拖动小鸟瞄准 · 松手发射 · 飞行中点击释放技能 · R 重玩 · M 静音</div>

</body>
</html>
